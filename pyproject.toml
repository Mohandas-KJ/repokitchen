[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repokitchen"
version = "0.1.0"
description = "A recipe-driven Linux repository setup and software installation CLI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
repokitchen = "repokitchen.main:main"

[tool.setuptools.packages.find]
include = ["repokitchen*"]
